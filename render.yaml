services:
  - type: web
    name: school-management-v8
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from app import app, db; app.app_context().push(); db.create_all()"
    startCommand: gunicorn --workers 2 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-v8-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app
      - key: FLASK_ENV
        value: production

databases:
  - name: school-management-v8-db
    plan: free